{% extends 'base.html' %}
{% block title %}Reset password — Learn Together{% endblock %}
{% block public_content %}
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-form-wrapper">
      <div class="auth-card">
        <div style="margin-bottom:8px"><h3>Set a new password</h3></div>
        <form method="POST" action="{{ url_for('forgot_password_reset') }}" id="resetPasswordForm">
          <input type="hidden" name="user_id" value="{{ user_id }}">
          <div class="form-group">
            <label class="form-label">New password</label>
            <input type="password" name="password" id="newPassword" class="form-control" required pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters, include an uppercase letter and a special character">
            <div style="font-size:13px;color:var(--gray-500);margin-top:6px">Password must be at least 8 characters, include an uppercase letter and a special character.</div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm password</label>
            <input type="password" name="password_confirm" id="confirmPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:12px">Set password</button>
        </form>
      </div>
    </div>
    <div class="auth-image-wrapper">
      {% if login_media %}
        <img src="{{ url_for('static', filename=login_media.file_path) }}" alt="Learn Together Platform" class="auth-image">
      {% else %}
        <img src="{{ url_for('static', filename='videos/lms.avif') }}" alt="Learn Together Platform" class="auth-image">
      {% endif %}
    </div>
  </div>
</div>

<script>
document.getElementById('resetPasswordForm')?.addEventListener('submit', function(e){
  const pw = document.getElementById('newPassword')?.value || '';
  const confirm = document.getElementById('confirmPassword')?.value || '';
  if (pw !== confirm) {
    e.preventDefault();
    alert('Passwords do not match.');
    return;
  }
  const reUpper = /[A-Z]/;
  const reSpecial = /[^A-Za-z0-9]/;
  if (pw.length < 8 || !reUpper.test(pw) || !reSpecial.test(pw)) {
    e.preventDefault();
    alert('Password must be at least 8 characters and include an uppercase letter and a special character.');
    return;
  }
});
</script>
{% endblock %}
